spring.application.name=kaagapay-backend
server.port=8081
server.address=0.0.0.0
spring.config.import=optional:file:.env[.properties]

# Data Source
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Swagger
# Multipart Upload Limits (phone photos = 2-5MB, videos = 10-50MB+)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.with-credentials=true
springdoc.default-consumes-media-type=application/x-www-form-urlencoded


# JWT Configuration
spring.jackson.date-format=MMM dd, yyyy h:mm a
jwt.secret=${JWT_TOKEN}
jwt.expiration=3600000
jwt.refreshExpiration=604800000

# PUSHY
pushy.secret.api.key=${PUSHY_API}

# Logging (native Spring Boot stack via SLF4J/Logback)
# Includes request id from MDC (populated by RequestIdMdcFilter)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [requestId=%X{requestId}] %logger{36} - %msg%n

# HTTP Request/Response Logging
logging.level.backend.logging.HttpRequestLoggingFilter=INFO

# Optional: Enable Spring's built-in request logging (less detailed)
# logging.level.org.springframework.web=DEBUG
# spring.mvc.log-request-details=true
